[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridfee-signal"
version = "0.1.0"
description = "Open-source congestion-based grid fee signals for battery storage in Germany"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pypsa>=1.4,<2",
    "highspy>=1.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gridfee = "gridfee.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gridfee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# typer declares options as call defaults
ignore = ["B008"]
